name: build
on:
  push:
    branches: [ci/build-perf]
  workflow_dispatch:
jobs:
  assembleDebug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Placeholder google-services.json (CI only)
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "com.project.lol"}},
              "api_key": [{"current_key": "AIzaSyA-ci-placeholder-000000000000000"}]
            }],
            "configuration_version": "1"
          }
          JSON
      - run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
